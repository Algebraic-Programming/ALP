[build-system]
requires = ["setuptools>=61.0", "wheel", "pybind11>=2.6"]
build-backend = "setuptools.build_meta"

[project]
name = "pyalp"
version = "0.0.0"
description = "Python bindings for ALP GraphBLAS (minimal package layout)"
authors = [ { name = "ALP" } ]
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.8"

[tool.setuptools.packages.find]
where = ["src"]
