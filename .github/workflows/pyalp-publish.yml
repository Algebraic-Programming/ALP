name: pyalp wheels (cibuildwheel)

on:
  push:
    tags: [ 'pyalp.v*' ]
  workflow_dispatch: {}

jobs:
  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify pinned pybind11 submodule commit
        if: runner.os == 'Linux' || runner.os == 'macOS' || runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if [ -f pyalp/PINNED_PYBIND11 ]; then
            PINNED_SHA=$(tr -d '\n' < pyalp/PINNED_PYBIND11)
          elif [ -f pyalp/extern/pybind11/PINNED_COMMIT ]; then
            PINNED_SHA=$(tr -d '\n' < pyalp/extern/pybind11/PINNED_COMMIT)
          else
            echo "No pinned commit file found (pyalp/PINNED_PYBIND11 or pyalp/extern/pybind11/PINNED_COMMIT)" >&2
            exit 2
          fi
          ACTUAL=$(git -C pyalp/extern/pybind11 rev-parse HEAD || true)
          echo "Expected pybind11 commit: $PINNED_SHA"
          echo "Found pybind11 commit: $ACTUAL"
          test "$ACTUAL" = "$PINNED_SHA"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install cibuildwheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install cibuildwheel==2.21.3

      - name: Build wheels
        env:
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-*"
          CIBW_SKIP: "*-musllinux* pp* *-win32 *-manylinux_i686"
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_ARCHS_MACOS: "x86_64 arm64"
          CIBW_ARCHS_WINDOWS: "AMD64"
          CIBW_BUILD_VERBOSITY: "1"
          # Ensure submodule headers are used by setup.py
          CIBW_ENVIRONMENT: |
            PYTHONUTF8=1
          # Prebuild the CMake-based extension so setup.py can bundle the prebuilt .so.
          # In cibuildwheel containers, /project is the package root (pyalp/),
          # where pyalp/CMakeLists.txt adds the src/ subdir and defines the _pyalp target.
          CIBW_BEFORE_BUILD: |
            python -m pip install --upgrade pip
            python -m pip install cmake ninja
            # /project is the repository root in the container; configure from the pyalp package dir
            cmake -S pyalp -B build_pyalp -DCMAKE_BUILD_TYPE=Release
            cmake --build build_pyalp --target _pyalp -- -j
        run: |
          python -m cibuildwheel --output-dir wheelhouse pyalp

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: pyalp-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

